<!doctype html>

<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TV altyazı düzeni</title>
  <link rel="stylesheet" href="editor.css">
</head>
<body>
  <main class="layout">
    <section class="left">
      <div class="stage-wrap" id="stage-wrap">
        <div class="stage" id="stage" tabindex="0" aria-label="TV ekranı. Altyazıyı fareyle sürükleyin ya da ok tuşlarıyla kaydırın.">
          <div class="stage-label">PS5 görüntüsü</div>
          <div id="subtitle"><span id="subtitle-text"></span></div>
        </div>
      </div>
      <div class="readout" id="readout">X – · Y – (sayfa pikseli)</div>
      <label class="field sample">
        <span>Örnek metin</span>
        <textarea id="sample" rows="3"></textarea>
      </label>
    </section>

    <section class="right" id="controls">
      <div class="status" id="status"></div>

      <label class="field"><span>Hazır konum</span><select id="preset"></select></label>
      <div class="pair">
        <label class="field"><span>X</span><input type="number" id="x" step="1"></label>
        <label class="field"><span>Y (alt kenar)</span><input type="number" id="y" step="1"></label>
      </div>
      <label class="field"><span>Yazı boyutu</span><div class="slider"><input type="range" id="fontSize"><output id="fontSize-out"></output></div></label>
      <label class="field"><span>Kutu genişliği</span><div class="slider"><input type="range" id="width"><output id="width-out"></output></div></label>
      <label class="field"><span>Ekran kenar boşluğu</span><div class="slider"><input type="range" id="margin"><output id="margin-out"></output></div></label>

      <div class="field"><span>Yazı rengi</span><div class="colors"><div class="swatches" id="textColor-sw"></div><input type="color" id="textColor" aria-label="Yazı rengi seç"></div></div>
      <div class="field"><span>Arka plan rengi</span><div class="colors"><div class="swatches" id="bgColor-sw"></div><input type="color" id="bgColor" aria-label="Arka plan rengi seç"></div></div>
      <label class="field"><span>Arka plan saydamlığı</span><div class="slider"><input type="range" id="bgOpacity"><output id="bgOpacity-out"></output></div></label>

      <div class="pair">
        <label class="field"><span>Kenarlık / gölge</span><select id="outline">
          <option value="none">Yok</option><option value="shadow">Gölge</option><option value="outline">Kenarlık</option><option value="both">Gölge + kenarlık</option>
        </select></label>
        <label class="field"><span>Hizalama</span><select id="align">
          <option value="left">Sol</option><option value="center">Orta</option><option value="right">Sağ</option>
        </select></label>
      </div>
      <label class="check"><input type="checkbox" id="bold"> Kalın</label>
      <label class="check"><input type="checkbox" id="live" checked> TV'de canlı önizle</label>

      <div class="buttons">
        <button type="button" id="save" class="primary">TV'ye kaydet</button>
        <button type="button" id="cancel">Vazgeç</button>
        <button type="button" id="reset">Varsayılana dön</button>
      </div>
      <div class="debug" id="debug" hidden></div>
      <footer>Ludora, CouchSubs ve GameTranslator tabanlıdır (AGPL-3.0)</footer>
    </section>
  </main>
  <script src="../webos/subtitle-settings.js"></script>
  <script src="../webos/subtitle-layout.js"></script>
  <script src="editor.js"></script>
</body>
</html>
