name: Build Android TV

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # tv/webos/tests/run.sh macOS'a özgü jsc kullanır; build-mac.yml içinde çalışır.
      - name: Build APK
        working-directory: tv/android
        run: java -cp gradle/wrapper/gradle-wrapper.jar org.gradle.wrapper.GradleWrapperMain assembleRelease --no-daemon

      - name: Rename APK
        run: cp tv/android/app/build/outputs/apk/release/app-release.apk AltyaziKoprusu-TV.apk

      - uses: actions/upload-artifact@v4
        with:
          name: AltyaziKoprusu-TV-apk
          path: AltyaziKoprusu-TV.apk
          if-no-files-found: error
