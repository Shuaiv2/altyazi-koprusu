name: Build macOS

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Swift unit tests
        run: |
          C=core/Sources/GameTranslatorCore
          swiftc -parse-as-library -o "$RUNNER_TEMP/subtitle-filter-tests" mac/SubtitleFilter.swift \
            $C/SubtitleStabilizer.swift $C/OcrNoise.swift $C/TextMatch.swift mac/tests/SubtitleFilterTests.swift
          "$RUNNER_TEMP/subtitle-filter-tests"
          swiftc -parse-as-library -o "$RUNNER_TEMP/sentence-joiner-tests" mac/SentenceJoiner.swift mac/tests/SentenceJoinerTests.swift
          "$RUNNER_TEMP/sentence-joiner-tests"

      - name: TV web tests
        run: zsh tv/webos/tests/run.sh

      - name: Build TV APK
        working-directory: tv/android
        run: java -cp gradle/wrapper/gradle-wrapper.jar org.gradle.wrapper.GradleWrapperMain assembleRelease --no-daemon

      - name: Build app
        run: bash mac/build-altyazi-koprusu.sh dist

      - name: Zip app
        run: ditto -c -k --keepParent dist/AltyaziKoprusu.app AltyaziKoprusu-macOS-arm64.zip

      - uses: actions/upload-artifact@v4
        with:
          name: AltyaziKoprusu-macOS-arm64
          path: AltyaziKoprusu-macOS-arm64.zip
          if-no-files-found: error
