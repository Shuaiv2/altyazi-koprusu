name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  mac:
    uses: ./.github/workflows/build-mac.yml
  android:
    uses: ./.github/workflows/build-android.yml
  windows:
    uses: ./.github/workflows/build-windows.yml

  release:
    needs: [mac, android, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true

      - name: List
        run: ls -l assets

      - uses: softprops/action-gh-release@v2.0.8
        with:
          files: |
            assets/AltyaziKoprusu-macOS-arm64.zip
            assets/AltyaziKoprusu-Windows-x64.zip
            assets/AltyaziKoprusu-TV.apk
          fail_on_unmatched_files: true
